# The browser tests' own stack: another Compose project on port 8081 whose
# database and media live only as long as its containers, so test users,
# groups and posts never land in the instance on port 8080. From e2e/:
#   npm run stack:up     start it (or rebuild it after code changes)
#   npm run stack:down   remove it together with everything the tests wrote
services:
  mysql:
    volumes: !reset []
  # Its own test inbox on 8026, which the tests read letters from.
  mailpit:
    ports: !override
      - "8026:8025"
  app:
    ports: !override
      - "8081:8080"
    volumes: !reset []
    # Always the test inbox: a real mailbox set in the shell for the main
    # stack must never get the tests' letters.
    environment:
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_SMTP_AUTH: "false"
      MAIL_STARTTLS: "false"
      MAIL_FROM: SocialPath <no-reply@socialpath.test>
      MAIL_INBOX_URL: http://localhost:8026
