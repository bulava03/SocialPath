<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialPath</title>
    <link rel="stylesheet" href="/style/layout.css">
    <link rel="stylesheet" href="/style/userIconStyle.css">
    <link rel="stylesheet" href="/style/gradientPage.css">
    <link rel="stylesheet" href="/style/lists.css">
</head>
<body>
<div th:insert="~{shared/layout2 :: #layoutHeader}"></div>

<main class="list-page">
    <div th:replace="~{shared/cards :: header('Groups', @{/user/anotherUserPage(anotherUserLogin=${login})}, ${#lists.size(groups)})}"></div>

    <div class="list-grid">
        <div class="list-card" th:each="elem : ${groups}">
            <th:block th:replace="~{shared/cards :: group(${elem})}"></th:block>
        </div>
    </div>
    <p class="list-empty" th:if="${#lists.isEmpty(groups)}">Not a member of any group yet.</p>
</main>

<footer id="layoutFooter">
    <p>&copy; <span th:text="${#dates.year(#dates.createNow())}"></span> - SocialPath</p>
</footer>
</body>
</html>
