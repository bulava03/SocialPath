<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <div id="left" class="card">
        <img th:if="${avatar == null} and ${isAuthor}" src="/pictures/photo.png" alt="usericon">
        <img th:if="${avatar != null} and ${isAuthor}"
             th:src="'/images/' + ${avatar}" alt="Image">

        <img th:if="${avatarAnother == null} and !${isAuthor}" src="/pictures/photo.png" alt="usericon">
        <img th:if="${avatarAnother != null} and !${isAuthor}"
             th:src="'/images/' + ${avatarAnother}" alt="Image">

        <h1 th:text="${user.FirstName + ' ' + (user.LastName ?: '')}"></h1>

        <dl class="profile-info" th:with="own=${user.login == author.login}">
            <div th:if="${user.phoneVisibleTo(author.login)}">
                <dt>Phone</dt>
                <dd>
                    <a th:if="${user.phone != null}" th:href="'tel:' + ${user.phone}" th:text="${user.phoneForDisplay}"></a>
                    <span th:unless="${user.phone != null}" th:text="${user.phoneForDisplay}"></span>
                    <!-- Who else sees it: shown to the owner only. -->
                    <span class="contact-visibility" th:if="${own}"
                          th:text="${user.phoneVerified} ? '(' + ${user.phoneVisibility.label} + ')' : '(Only me until confirmed)'"></span>
                    <a class="phone-fix" th:if="${user.phone == null and own}"
                       href="/user/getUserInfo">Add the country code</a>
                </dd>
            </div>
            <div th:if="${user.emailVisibleTo(author.login)}">
                <dt>Email</dt>
                <dd>
                    <span th:text="${user.email}"></span>
                    <span class="contact-visibility" th:if="${own}"
                          th:text="${user.emailVerified} ? '(' + ${user.emailVisibility.label} + ')' : '(Only me until confirmed)'"></span>
                    <p class="contact-unconfirmed" th:if="${own and !user.emailVerified}">
                        Not confirmed yet: it cannot be used to sign in or shown to others.
                        <a href="/security/email">Confirm it on the Security page</a>
                    </p>
                </dd>
            </div>
            <div th:if="${user.DateOfBirth != null}"><dt>Date of birth</dt><dd th:text="${#temporals.format(user.DateOfBirth, 'dd.MM.yyyy')}"></dd></div>
            <div th:if="${user.country != null}"><dt>Country</dt><dd th:text="${user.country.name}"></dd></div>
            <div th:if="${user.Region != null and user.Region != ''}"><dt>Region</dt><dd th:text="${user.Region}"></dd></div>
            <div th:if="${user.City != null and user.City != ''}"><dt>City</dt><dd th:text="${user.City}"></dd></div>
            <div th:if="${user.Education != null and user.Education != ''}"><dt>Education</dt><dd th:text="${user.Education}"></dd></div>
            <div th:if="${user.Workplace != null and user.Workplace != ''}"><dt>Workplace</dt><dd th:text="${user.Workplace}"></dd></div>
        </dl>

        <div class="profile-nav" th:insert="~{user/partsOfPages/leftFrameButtons}"></div>
    </div>
</html>
