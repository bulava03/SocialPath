<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialPath</title>
    <link rel="stylesheet" href="/style/layout.css">
    <link rel="stylesheet" href="/style/gradientPage.css">
    <link rel="stylesheet" href="/style/userIconStyle.css">
    <link rel="stylesheet" href="/style/forms.css">
</head>
<body>
<div th:insert="~{shared/layout2 :: #layoutHeader}"></div>

<main class="form-page">
    <div class="form-card form-card-narrow">
        <h1 class="form-title">Change password</h1>
        <form id="regform" class="form-stack" method="post" action="/user/changePassword">
            <label class="name" for="oldPassword">Old password</label>
            <input class="field" id="oldPassword" type="password" name="oldPassword" autocomplete="current-password" />
            <label class="name" for="password">New password</label>
            <input class="field" id="password" type="password" name="password" autocomplete="new-password" />
            <p class="form-hint">8 to 20 characters.</p>
            <p class="errortext" th:text="${errorText}"></p>
            <button class="btn btn-primary btn-block" type="submit">Save</button>
        </form>
        <div class="form-footer"><a class="back-link with-icon" href="/user/authorisation">To my page</a></div>
    </div>
</main>

<footer id="layoutFooter">
    <p>&copy; <span th:text="${#dates.year(#dates.createNow())}"></span> - SocialPath</p>
</footer>

</body>
</html>
