<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialPath</title>
    <link rel="stylesheet" href="/style/layout.css">
    <link rel="stylesheet" href="/style/userIconStyle.css">
    <link rel="stylesheet" href="/style/gradientPage.css">
    <link rel="stylesheet" href="/style/lists.css">
</head>
<body>
<div th:insert="~{shared/layout2 :: #layoutHeader}"></div>

<main class="list-page">
    <div th:replace="~{shared/cards :: header('Friends', @{/user/anotherUserPage(anotherUserLogin=${login})}, ${#lists.size(users)})}"></div>

    <div class="list-grid">
        <div class="list-card" th:each="elem : ${users}">
            <th:block th:replace="~{shared/cards :: person(${elem})}"></th:block>
            <div class="list-actions">
                <form th:if="${login == author.login}" method="post" action="/user/removeFromFriendsMyPage">
                    <input type="hidden" name="id" th:value="${elem.anotherUserLogin}">
                    <button class="btn btn-danger" type="submit">Remove from friends</button>
                </form>
            </div>
        </div>
    </div>
    <p class="list-empty" th:if="${#lists.isEmpty(users)}">No friends yet.</p>
</main>

<footer id="layoutFooter">
    <p>&copy; <span th:text="${#dates.year(#dates.createNow())}"></span> - SocialPath</p>
</footer>
</body>
</html>
