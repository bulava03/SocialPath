<html xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="renderComment(comment)">
  <div class="comment" th:id="${comment.id}">
    <a class="avatar-link" th:href="@{/user/anotherUserPage(anotherUserLogin=${comment.authorLogin})}">
      <img class="commentImage" th:if="${comment.authorImageId == null}" src="/usericon.png" alt="usericon">
      <img class="commentImage" th:unless="${comment.authorImageId == null}" th:src="'/images/' + ${comment.authorImageId} + '?size=thumb'" alt="usericon"
           width="30px" height="30px">
    </a>
    <a class="username" th:href="@{/user/anotherUserPage(anotherUserLogin=${comment.authorLogin})}"
       th:text="${comment.authorName}"></a>
    <div class="commentText" th:text="${comment.text}"></div>
    <div class="commentMedia">
      <div th:if="${comment.media != null and !comment.media.isEmpty()}">
        <div th:if="${comment.media.size() == 1 and comment.isVideo}">
          <video th:if="${comment.videoStatus == 'READY'}" preload="metadata" controls th:src="'/images/' + ${comment.media[0]}"></video>
          <!-- Converted in the background; comments.js swaps this for the player once it is ready. -->
          <p th:if="${comment.videoStatus == 'PROCESSING'}" class="video-processing" th:data-video-id="${comment.media[0]}">Video is processing…</p>
          <p th:if="${comment.videoStatus == 'FAILED'}" class="video-failed">This video could not be processed.</p>
        </div>

        <div th:if="${comment.media.size() > 0 and !comment.isVideo}">
          <div th:if="${comment.media.size() == 1}">
            <div class="media-preview">
              <img loading="lazy" th:src="'/images/' + ${comment.media[0]}" alt="image" style="max-height: 300px; object-fit: contain;">
            </div>
          </div>

          <div th:if="${comment.media.size() == 2}">
            <table class="mediaTable">
              <tr>
                <td>
                  <img loading="lazy" th:src="'/images/' + ${comment.media[0]}" alt="image" style="max-height: 300px; object-fit: contain;">
                </td>
                <td>
                  <img loading="lazy" th:src="'/images/' + ${comment.media[1]}" alt="image" style="max-height: 300px; object-fit: contain;">
                </td>
              </tr>
            </table>
          </div>

          <div th:if="${comment.media.size() == 3}">
            <table class="mediaTable">
              <tr>
                <td colspan="2">
                  <img loading="lazy" th:src="'/images/' + ${comment.media[0]}" alt="image" style="max-height: 300px; object-fit: contain;">
                </td>
              </tr>
              <tr>
                <td>
                  <img loading="lazy" th:src="'/images/' + ${comment.media[1]}" alt="image" style="max-height: 150px; object-fit: contain;">
                </td>
                <td>
                  <img loading="lazy" th:src="'/images/' + ${comment.media[2]}" alt="image" style="max-height: 150px; object-fit: contain;">
                </td>
              </tr>
            </table>
          </div>

          <div th:if="${comment.media.size() == 4}">
            <table class="mediaTable">
              <tr>
                <td>
                  <img loading="lazy" th:src="'/images/' + ${comment.media[0]}" alt="image" style="max-height: 200px; object-fit: contain;">
                </td>
                <td>
                  <img loading="lazy" th:src="'/images/' + ${comment.media[1]}" alt="image" style="max-height: 200px; object-fit: contain;">
                </td>
              </tr>
              <tr>
                <td>
                  <img loading="lazy" th:src="'/images/' + ${comment.media[2]}" alt="image" style="max-height: 200px; object-fit: contain;">
                </td>
                <td>
                  <img loading="lazy" th:src="'/images/' + ${comment.media[3]}" alt="image" style="max-height: 200px; object-fit: contain;">
                </td>
              </tr>
            </table>
          </div>

          <div th:if="${comment.media.size() == 5}">
            <table class="mediaTable">
              <tr>
                <td colspan="2">
                  <img loading="lazy" th:src="'/images/' + ${comment.media[0]}" alt="image" style="max-height: 300px; object-fit: contain;">
                </td>
              </tr>
              <tr>
                <td>
                  <img loading="lazy" th:src="'/images/' + ${comment.media[1]}" alt="image" style="max-height: 150px; object-fit: contain;">
                </td>
                <td>
                  <img loading="lazy" th:src="'/images/' + ${comment.media[2]}" alt="image" style="max-height: 150px; object-fit: contain;">
                </td>
              </tr>
              <tr>
                <td>
                  <img loading="lazy" th:src="'/images/' + ${comment.media[3]}" alt="image" style="max-height: 150px; object-fit: contain;">
                </td>
                <td>
                  <img loading="lazy" th:src="'/images/' + ${comment.media[4]}" alt="image" style="max-height: 150px; object-fit: contain;">
                </td>
              </tr>
            </table>
          </div>
        </div>
      </div>
    </div>

    <button class="reply-btn" th:if="${group.isMember(author.login)}" th:attr="onclick='makeVisible(\'' + ${comment.id} + '\')'">Reply</button>
    <button class="delete-btn" th:if="${comment.authorLogin == author.login || group.isModerator(author.login)}" th:attr="onclick='submitRemoveComment(\'' + ${comment.id} + '\')'">Delete</button>

    <div class="reply-section" th:classappend="${comment.id}" style="display: none;">
      <textarea type="text" th:id="'publication-text-' + ${comment.id}" class="reply-field" th:classappend="${comment.id}" placeholder="Write your comment here..."></textarea>

      <div th:id="'publication-media-preview-' + ${comment.id}" class="media-preview" th:classappend="${comment.id}"></div>
      <input type="file" th:id="'publication-media-' + ${comment.id}" class="media-field" name="media" accept="image/*,video/*" multiple style="display: none;">

      <div class="publication-actions">
        <button type="button" th:id="'publication-add-media-btn-' + ${comment.id}" class="publication-add-media-btn">Add media</button>
        <button class="publish-btn" th:attr="onclick='submitComment(\'' + ${comment.id} + '\')'">Publish</button>
      </div>
      <p th:replace="~{shared/mediaLimits :: hint}"></p>
    </div>

    <th:block th:if="${comment.publications != null and comment.publications.size() > 0}">
      <th:block th:each="i : ${#numbers.sequence(comment.publications.size() - 1, 0, -1)}">
        <div th:class="'comment-divider' + (${i == comment.publications.size() - 1} ? ' first' : '')"></div>
        <div th:replace="~{renderComment/renderCommentGroup :: renderComment(comment=${comment.publications[i]})}"></div>
      </th:block>
    </th:block>
  </div>
</th:block>

</html>
