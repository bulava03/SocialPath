<html xmlns:th="http://www.thymeleaf.org">
  <th:block th:fragment="renderComment(comment)">
    <div class="comment" th:id="${comment.id}">
      <a class="avatar-link" th:href="@{/user/anotherUserPage(anotherUserLogin=${comment.authorLogin})}">
        <img class="commentImage" th:if="${comment.authorImageId == null}" src="/usericon.png" alt="usericon">
        <img class="commentImage" th:unless="${comment.authorImageId == null}" th:src="'/images/' + ${comment.authorImageId} + '?size=thumb'" alt="usericon"
             width="30px" height="30px">
      </a>
      <a class="username" th:href="@{/user/anotherUserPage(anotherUserLogin=${comment.authorLogin})}"
         th:text="${comment.authorName}"></a>
      <div class="commentText" th:text="${comment.text}"></div>
      <div class="commentMedia" th:insert="~{renderComment/media :: media(comment=${comment})}"></div>

      <button class="reply-btn" th:attr="onclick='makeVisible(\'' + ${comment.id} + '\')'">Reply</button>
      <button class="delete-btn" th:if="${comment.authorLogin == author.login || author.login == user.login}" th:attr="onclick='submitRemoveComment(\'' + ${comment.id} + '\')'">Delete</button>

      <div class="reply-section" th:classappend="${comment.id}" style="display: none;">
        <textarea type="text" th:id="'publication-text-' + ${comment.id}" class="reply-field" th:classappend="${comment.id}" placeholder="Write your comment here..."></textarea>

        <div th:id="'publication-media-preview-' + ${comment.id}" class="media-preview" th:classappend="${comment.id}"></div>
        <input type="file" th:id="'publication-media-' + ${comment.id}" class="media-field" name="media" accept="image/*,video/*" multiple style="display: none;">

        <div class="publication-actions">
          <button type="button" th:id="'publication-add-media-btn-' + ${comment.id}" class="publication-add-media-btn">Add media</button>
          <button class="publish-btn" th:attr="onclick='submitComment(\'' + ${comment.id} + '\')'">Publish</button>
        </div>
        <p th:replace="~{shared/mediaLimits :: hint}"></p>
      </div>

      <th:block th:if="${comment.publications != null and comment.publications.size() > 0}">
        <th:block th:each="i : ${#numbers.sequence(comment.publications.size() - 1, 0, -1)}">
          <div th:class="'comment-divider' + (${i == comment.publications.size() - 1} ? ' first' : '')"></div>
          <div th:replace="~{renderComment/renderCommentUser :: renderComment(comment=${comment.publications[i]})}"></div>
        </th:block>
      </th:block>
    </div>
  </th:block>
</html>
