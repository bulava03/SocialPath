<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <header id="layoutHeader">
        <div class="navbar-header">
            <a id="bigbuttonlink" href="/user/authorisation">SocialPath</a>
        </div>
        <div class="userIcon">
            <button type="button" class="usericon-button" popovertarget="dropdown" aria-label="User menu">
                <img th:if="${avatar == null}" id="usericon" width="30px" height="30px" alt="usericon"
                     src="/pictures/photo.png">
                <img th:unless="${avatar == null}" id="usericon" width="30px" height="30px" alt="usericon"
                     th:src="'/images/' + ${avatar} + '?size=thumb'">
            </button>
        </div>
        <div id="dropdown" class="dropdown" popover>
            <a href="/user/getUserInfo">Personal information</a>
            <a href="/user/getChangePasswordForm">Change password</a>
            <a href="/group/getGroupCreationForm">Create a group</a>
            <form class="dropdown-logout" method="post" action="/auth/logout">
                <button type="submit">Log out</button>
            </form>
        </div>
    </header>
</html>
