<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialPath</title>
    <link rel="stylesheet" href="/style/layout.css">
    <link rel="stylesheet" href="/style/gradientPage.css">
    <link rel="stylesheet" href="/style/forms.css">
</head>
<body>
<div th:insert="~{shared/layout :: #layoutHeader}"></div>

<main class="form-page">
    <div class="form-card">
        <h1 class="form-title">Create your account</h1>
        <p class="form-subtitle">Login, password, first name, phone and email are required. The rest is optional.</p>
        <!-- Server-side errors go on top: the form is long and the page reloads scrolled up. -->
        <p class="errortext errortext-top" th:if="${errorText}" th:text="${errorText}"></p>
        <form id="regform" method="post" action="/registration/registration">
            <div class="form-grid">
                <label class="name" for="login">Login</label>
                <input class="field" id="login" th:value="${User.login}" type="text" name="login">
                <label class="name" for="password">Password</label>
                <input class="field" id="password" type="password" name="password" autocomplete="new-password">
                <label class="name" for="name">First name</label>
                <input class="field" id="name" th:value="${User.firstName}" type="text" name="firstName">
                <label class="name" for="surname">Last name</label>
                <input class="field" id="surname" th:value="${User.lastName}" type="text" name="lastName">
                <label class="name" for="phone">Phone number</label>
                <input class="field" id="phone" th:value="${User.phoneNumber}" type="text" name="phoneNumber">
                <label class="name" for="email">Email</label>
                <input class="field" id="email" th:value="${User.email}" type="text" name="email">
                <label class="name" for="dob-day">Date of birth</label>
                <div class="dob-row">
                <input class="field" id="dob-day" th:value="${User.day}"
                       type="text" name="day" placeholder="Day" inputmode="numeric">
                <select id="dob-month" name="month">
                    <option value="" disabled hidden th:selected="${User.month == null}">Month</option>
                    <option value="1" th:selected="${User.month == '1'}">January</option>
                    <option value="2" th:selected="${User.month == '2'}">February</option>
                    <option value="3" th:selected="${User.month == '3'}">March</option>
                    <option value="4" th:selected="${User.month == '4'}">April</option>
                    <option value="5" th:selected="${User.month == '5'}">May</option>
                    <option value="6" th:selected="${User.month == '6'}">June</option>
                    <option value="7" th:selected="${User.month == '7'}">July</option>
                    <option value="8" th:selected="${User.month == '8'}">August</option>
                    <option value="9" th:selected="${User.month == '9'}">September</option>
                    <option value="10" th:selected="${User.month == '10'}">October</option>
                    <option value="11" th:selected="${User.month == '11'}">November</option>
                    <option value="12" th:selected="${User.month == '12'}">December</option>
                </select>
                <select id="dob-year" name="year">
                    <option value="" disabled hidden th:selected="${User.year == null}">Year</option>
                    <option th:each="y : ${#numbers.sequence(#dates.year(#dates.createNow()), 1900, -1)}"
                            th:value="${y}" th:text="${y}" th:selected="${#strings.toString(y) == User.year}"></option>
                </select>
                </div>
                <label class="name" for="country">Country</label>
                <select id="country" name="countryCode">
                    <option value="" th:selected="${#strings.isEmpty(User.countryCode)}">Country</option>
                    <option th:each="c : ${countries}" th:value="${c.code}" th:text="${c.name}"
                            th:selected="${c.code == User.countryCode}"></option>
                </select>
                <label class="name" for="region">Region</label>
                <input class="field" id="region" th:value="${User.Region}" type="text" name="region">
                <label class="name" for="city">City</label>
                <input class="field" id="city" th:value="${User.City}" type="text" name="city">
                <label class="name" for="education">Education</label>
                <input class="field" id="education" th:value="${User.Education}" type="text" name="education">
                <label class="name" for="workplace">Workplace</label>
                <input class="field" id="workplace" th:value="${User.Workplace}" type="text" name="workplace">
                <div class="form-actions"><button class="btn btn-primary" type="submit">Sign up</button></div>
            </div>
        </form>
        <p class="form-switch">Already have an account? <a href="/">Sign in</a></p>
    </div>
</main>

<footer id="layoutFooter">
    <p>&copy; <span th:text="${#dates.year(#dates.createNow())}"></span> - SocialPath</p>
</footer>

</body>
</html>
