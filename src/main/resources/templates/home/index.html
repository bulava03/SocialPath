<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialPath</title>
    <link rel="stylesheet" href="/style/layout.css">
    <link rel="stylesheet" href="/style/gradientPage.css">
    <link rel="stylesheet" href="/style/forms.css">
</head>
<body>
<div th:insert="~{shared/layoutIndex :: #layoutHeader}"></div>

<main class="form-page">
    <div class="form-card form-card-narrow">
        <h1 class="form-title">Welcome back</h1>
        <p class="form-subtitle">Sign in to see what your friends are up to.</p>
        <form id="authForm" class="form-stack" action="/auth/login" method="post">
            <label class="name" for="login">Login</label>
            <input class="field" id="login" name="login" type="text" th:value="${login}"
                   autocomplete="username" required>
            <label class="name" for="password">Password</label>
            <input class="field" id="password" name="password" type="password"
                   autocomplete="current-password" required>
            <p id="errortext" class="errortext" th:text="${errorText}"></p>
            <button class="btn btn-primary btn-block" type="submit">Sign in</button>
        </form>
        <p class="form-switch">New to SocialPath? <a href="/registration">Sign up</a></p>
    </div>
</main>

<footer id="layoutFooter">
    <p>&copy; <span th:text="${#dates.year(#dates.createNow())}"></span> - SocialPath</p>
</footer>

</body>
</html>
