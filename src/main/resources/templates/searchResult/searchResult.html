<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialPath</title>
    <link rel="stylesheet" href="/style/layout.css">
    <link rel="stylesheet" href="/style/userIconStyle.css">
    <link rel="stylesheet" href="/style/gradientPage.css">
    <link rel="stylesheet" href="/style/lists.css">
    <link rel="stylesheet" href="/style/searchStyle.css">
</head>
<body>
<div th:insert="~{shared/layout2 :: #layoutHeader}"></div>

<main class="list-page">
    <form id="searchForm" method="get" th:action="@{/searchResult/getSearchResult}">
        <input id="searchInput" type="text" name="searchText" placeholder="Search..." th:value="${param.searchText}"
               required pattern=".*\S.*" title="Enter something to search for">
        <input id="searchButton" type="submit" value="Search">
    </form>

    <section class="list-section">
        <h2 class="list-section-title">People <span class="list-count" th:text="${#lists.size(users)}"></span></h2>
        <div class="list-grid">
            <div class="list-card" th:each="elem : ${users}">
                <th:block th:replace="~{shared/cards :: person(${elem})}"></th:block>
            </div>
        </div>
        <p class="list-empty" th:if="${#lists.isEmpty(users)}">No people found.</p>
    </section>

    <section class="list-section">
        <h2 class="list-section-title">Groups <span class="list-count" th:text="${#lists.size(groups)}"></span></h2>
        <div class="list-grid">
            <div class="list-card" th:each="elem : ${groups}">
                <th:block th:replace="~{shared/cards :: group(${elem})}"></th:block>
            </div>
        </div>
        <p class="list-empty" th:if="${#lists.isEmpty(groups)}">No groups found.</p>
    </section>
</main>

<footer id="layoutFooter">
    <p>&copy; <span th:text="${#dates.year(#dates.createNow())}"></span> - SocialPath</p>
</footer>
</body>
</html>
