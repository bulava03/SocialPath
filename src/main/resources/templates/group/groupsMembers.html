<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialPath</title>
    <link rel="stylesheet" href="/style/layout.css">
    <link rel="stylesheet" href="/style/userIconStyle.css">
    <link rel="stylesheet" href="/style/gradientPage.css">
    <link rel="stylesheet" href="/style/lists.css">
</head>
<body>
<div th:insert="~{shared/layout2 :: #layoutHeader}"></div>

<main class="list-page">
    <div th:replace="~{shared/cards :: header('Members', @{/searchResult/getGroupPage(groupId=${groupId})}, ${#lists.size(users)})}"></div>

    <div class="list-grid">
        <div class="list-card" th:each="elem : ${users}">
            <th:block th:replace="~{shared/cards :: person(${elem})}"></th:block>
            <div class="list-actions">
                <form th:if="${(not admins.contains(elem.anotherUserLogin) and admins.contains(author.login)) or (owner == author.login and elem.anotherUserLogin != owner)}" method="post" action="/group/removeUserFromGroup">
                    <input type="hidden" name="groupId" th:value="${groupId}">
                    <input type="hidden" name="userId" th:value="${elem.anotherUserLogin}">
                    <button class="btn btn-danger" type="submit">Remove from group</button>
                </form>
                <form th:if="${author.login == owner and !admins.contains(elem.anotherUserLogin)}" method="post" action="/group/addToAdmins">
                    <input type="hidden" name="groupId" th:value="${groupId}">
                    <input type="hidden" name="userId" th:value="${elem.anotherUserLogin}">
                    <button class="btn btn-soft" type="submit">Make admin</button>
                </form>
                <form th:if="${author.login == owner and elem.anotherUserLogin != owner and admins.contains(elem.anotherUserLogin)}" method="post" action="/group/removeFromAdmins">
                    <input type="hidden" name="groupId" th:value="${groupId}">
                    <input type="hidden" name="userId" th:value="${elem.anotherUserLogin}">
                    <button class="btn btn-danger" type="submit">Remove from admins</button>
                </form>
            </div>
        </div>
    </div>
    <p class="list-empty" th:if="${#lists.isEmpty(users)}">No members yet.</p>
</main>

<footer id="layoutFooter">
    <p>&copy; <span th:text="${#dates.year(#dates.createNow())}"></span> - SocialPath</p>
</footer>
</body>
</html>
