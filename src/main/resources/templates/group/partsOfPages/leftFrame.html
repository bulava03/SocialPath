<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <div id="left" class="card">
    <img th:if="${groupAvatar == null}" src="/pictures/photo.png" alt="GroupIcon">
    <img th:unless="${groupAvatar == null}"
         th:src="'/images/' + ${groupAvatar}" alt="GroupIcon">

    <h1 th:text="${group.name}"></h1>

    <div class="profile-nav">
      <a class="leftFrameButton" th:if="${group.isOwner(author.login)}" th:href="@{/group/getGroupUpdatingForm(id=${group.id})}">Manage group</a>

      <a class="leftFrameButton" th:href="@{/group/getGroupsMembers(id=${group.id})}">Members</a>

      <a class="leftFrameButton" th:href="@{/group/getGroupsAdmins(id=${group.id})}">Admins</a>

      <form>
        <input id="formGroupId" type="hidden" th:value="${group.id}" />
      </form>

      <button id="joinButton" class="leftFrameButton"
              th:if="${not group.isMember(author.login)}" onclick="joinGroup()">Join group</button>
      <button id="leaveButton" class="leftFrameButton"
              th:if="${group.isMember(author.login) && not group.isOwner(author.login)}" onclick="leaveGroup()">Leave group</button>
    </div>
  </div>
</html>
