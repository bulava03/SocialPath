<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <div id="right">
    <form id="searchForm" method="get" action="/searchResult/getSearchResult">
        <input id="searchInput" type="text" name="searchText" placeholder="Search..."
               required pattern=".*\S.*" title="Enter something to search for">
        <input id="searchButton" type="submit" value="Search">
    </form>

    <div th:if="${group.isMember(author.login)}" id="new-publication" class="composer card">
        <form id="new-publication-form" enctype="multipart/form-data">
            <div class="composer-body">
                <img th:if="${avatar == null}" class="composer-avatar" src="/pictures/photo.png" alt="">
                <img th:unless="${avatar == null}" class="composer-avatar" th:src="'/images/' + ${avatar} + '?size=thumb'" alt="">
                <textarea id="publication-text" name="text" placeholder="What's new?" aria-label="New post"></textarea>
            </div>

            <div id="publication-media-preview" class="media-preview"></div>
            <input type="file" id="publication-media" name="media" accept="image/*,video/*" multiple style="display: none;">

            <div class="publication-actions">
                <button type="button" id="publication-add-media-btn" class="publication-add-media-btn">Add media</button>
                <button class="submit-btn" type="button" onclick="submitPublication()">Publish</button>
            </div>
            <p th:replace="~{shared/mediaLimits :: hint}"></p>
        </form>
    </div>

    <div id="publications" data-scope="group" th:data-target="${group.id}" th:data-latest="${latestActivity}">
      <!-- One feed portion, newest first; also returned on its own for the
           next portion and for refreshing a single post. The marker at the
           end tells comments.js where to continue. -->
      <th:block th:fragment="posts">
        <th:block th:each="post : ${publications}">
          <div th:replace="~{renderComment/renderCommentGroup :: renderComment(comment=${post})}"></div>
        </th:block>
        <div th:if="${nextBefore != null}" class="feed-more" th:data-before="${nextBefore}" aria-live="polite"></div>
      </th:block>
      <p class="feed-empty" th:if="${#lists.isEmpty(publications)}">No posts yet.</p>
    </div>
  </div>
</html>
