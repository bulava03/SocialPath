<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <div id="right">
    <form id="searchForm" method="get" action="/searchResult/getSearchResult">
        <input id="searchInput" type="text" name="searchText" placeholder="Search..."
               required pattern=".*\S.*" title="Enter something to search for">
        <input id="searchButton" type="submit" value="Search">
    </form>

    <div th:if="${group.members.contains(author.login)}">
      <br><br>
      <div id="new-comment">
        <form id="new-publication-form" enctype="multipart/form-data">
          <textarea id="publication-text" name="text" placeholder="Write a post..."></textarea>

          <div id="publication-media-preview" class="media-preview"></div>
          <input type="file" id="publication-media" name="media" accept="image/*,video/mp4" multiple style="display: none;">

          <div class="publication-actions">
            <button type="button" id="publication-add-media-btn" class="publication-add-media-btn">Add media</button>
            <button class="submit-btn" type="button" onclick="submitPublication()">Publish</button>
          </div>
        </form>
      </div>
    </div>

    <br><br>

    <div id="publications" th:fragment="publications" data-scope="group" th:data-target="${group.id}">
      <th:block th:if="${publications != null and publications.size() > 0}">
        <th:block th:each="i : ${#numbers.sequence(publications.size() - 1, 0, -1)}">
          <div  th:replace="~{renderComment/renderCommentGroup :: renderComment(comment=${publications[i]})}"></div>
        </th:block>
      </th:block>
      <p th:unless="${publications != null and publications.size() > 0}">No posts yet.</p>
    </div>
  </div>
</html>
