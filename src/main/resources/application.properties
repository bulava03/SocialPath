# MySQL connection. All values come from the environment with local-dev
# defaults; docker-compose overrides them for the containerized setup.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:socialpath}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Flyway owns the schema (see db/migration); Hibernate must never touch DDL.
spring.jpa.hibernate.ddl-auto=none
# Sessions end at the service layer; EAGER collection mappings make the
# rendered data available without an open session in the view.
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT: the secret must come from the environment in any real deployment.
# The default below exists only so the app can boot locally out of the box.
jwt.secret=${JWT_SECRET:local-dev-only-secret-key-change-me-0123456789abcdef0123456789abcdef}
# Token lifetime in milliseconds (24 hours).
jwt.expiration=86400000
jwt.cookie-name=token

# Where uploaded media (avatars, publication photos/videos) is stored.
app.media.dir=${MEDIA_DIR:./media}

# Convert avatars uploaded before avatar processing existed (square full
# version + thumbnail) on startup. Off by default; enable for one start when
# old avatars need converting. Already converted avatars are skipped.
app.avatars.convert-on-startup=${AVATAR_CONVERT_ON_STARTUP:false}

# Upload limits for publication media: a video up to 100MB, photos up to 10MB
# each (checked per file type in static/script/comments.js). The request limit
# leaves room for the post text and multipart overhead.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB
# When an upload goes over these limits Tomcat stops reading the request. By
# default it then drops the connection if more than 2MB are still unread, and
# the browser shows a connection error instead of the message on the form
# (UploadLimitExceptionHandler). Reading up to this much of the rest lets the
# response through.
server.tomcat.max-swallow-size=1GB

# Videos browsers cannot play are converted to MP4 in the background. One
# conversion is stopped after this long and tried again later (up to three
# times); a job left unfinished by a restart returns to the queue after it.
app.video.worker.timeout=${VIDEO_CONVERSION_TIMEOUT:10m}
