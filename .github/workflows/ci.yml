name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # System libraries the bundled ffmpeg needs on Linux (the same ones the
      # Dockerfile installs), so the HEIC/AVIF tests run instead of skipping.
      - name: Install ffmpeg runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxcb1 libxcb-shm0 libasound2t64 libpulse0

      - name: Build and test
        run: ./mvnw --batch-mode verify
